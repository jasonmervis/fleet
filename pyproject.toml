[project]
name = "fleet"
dynamic = ["version"]
description = "Run parallel coding agents on in-repo git worktrees via Herdr"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fleet = "fleet.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fleet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fleet"]

[tool.hatch.build.targets.wheel.force-include]
".claude/skills/fleet" = "fleet/skill"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["fleet"]
