# fleet config — committed, read by `fleet`. See `fleet config` for resolved values.
base = "main"
install = "uv sync --frozen"
test = "uv run pytest"
agent = "claude"
permission_mode = "auto"  # auto | edits | readonly
max_workers = 4
forge = "local"  # pinned: gh is logged in as another account; switch to "auto" once `gh auth switch -u jasonmervis`
