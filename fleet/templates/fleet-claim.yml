name: Fleet claim gate
run-name: claim-issue-${{ inputs.issue }}-${{ inputs.token }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: GitHub issue number to claim
        required: true
        type: string
      worker:
        description: Stable fleet worker identity
        required: true
        type: string
      branch:
        description: Branch the worker will create after the claim is granted
        required: true
        type: string
      token:
        description: Unique UUID generated by the requesting worker
        required: true
        type: string

# The issue number is the lock key. queue:max prevents a third contender from
# replacing an already-pending claim; every request gets a definitive result.
concurrency:
  group: fleet-claim-${{ github.repository_id }}-${{ inputs.issue }}
  queue: max

permissions:
  contents: read
  issues: write

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Claim issue if it is still eligible
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CLAIM_BRANCH: ${{ inputs.branch }}
          CLAIM_ISSUE: ${{ inputs.issue }}
          CLAIM_TOKEN: ${{ inputs.token }}
          CLAIM_WORKER: ${{ inputs.worker }}
        with:
          script: |
            const issueText = process.env.CLAIM_ISSUE;
            const worker = process.env.CLAIM_WORKER;
            const branch = process.env.CLAIM_BRANCH;
            const token = process.env.CLAIM_TOKEN;

            const issuePattern = /^[1-9][0-9]*$/;
            const workerPattern = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
            const branchPattern = /^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$/;
            const tokenPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

            if (!issuePattern.test(issueText)) {
              core.setFailed(`Invalid issue number: ${issueText}`);
              return;
            }
            if (!workerPattern.test(worker)) {
              core.setFailed(`Invalid worker identity: ${worker}`);
              return;
            }
            if (
              !branchPattern.test(branch) ||
              branch.includes("..") ||
              branch.includes("//") ||
              branch.includes("@{") ||
              branch.endsWith("/") ||
              branch.endsWith(".") ||
              branch.endsWith(".lock")
            ) {
              core.setFailed(`Invalid branch name: ${branch}`);
              return;
            }
            if (!tokenPattern.test(token)) {
              core.setFailed("The claim token must be a UUID");
              return;
            }

            const issue_number = Number(issueText);
            const { owner, repo } = context.repo;
            const marker = `<!-- fleet-claim-token:${token} -->`;
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });
            const labels = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name,
            );

            if (issue.pull_request) {
              core.setFailed(`#${issue_number} is a pull request, not an issue`);
              return;
            }
            if (issue.state !== "open") {
              core.setFailed(`#${issue_number} is not open`);
              return;
            }

            if (labels.includes("fleet-wip")) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              if (comments.some((comment) => comment.body?.includes(marker))) {
                core.info(`Claim ${token} was already granted; treating the retry as successful`);
                return;
              }
              core.setFailed(`#${issue_number} is already claimed`);
              return;
            }
            if (!labels.includes("fleet-ready")) {
              core.setFailed(`#${issue_number} does not have the fleet-ready label`);
              return;
            }

            let wipAdded = false;
            try {
              // fleet-wip is added first so a partial failure is fail-closed: a
              // second claimant cannot begin while this grant is being recorded.
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ["fleet-wip"],
              });
              wipAdded = true;
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: "fleet-ready",
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: [
                  marker,
                  "Claim granted by the serialized fleet gate.",
                  "",
                  `- Worker: \`${worker}\``,
                  `- Branch: \`${branch}\``,
                  `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                ].join("\n"),
              });
            } catch (error) {
              // Best-effort rollback keeps a transient API failure from silently
              // stranding the issue. A later reconciliation job can repair an
              // abrupt runner termination that occurs before this catch executes.
              if (wipAdded) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number,
                    name: "fleet-wip",
                  });
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number,
                    labels: ["fleet-ready"],
                  });
                } catch (rollbackError) {
                  core.warning(`Claim rollback failed: ${rollbackError.message}`);
                }
              }
              throw error;
            }

            core.notice(`Granted #${issue_number} to ${worker} on ${branch}`);
            await core.summary
              .addHeading("Fleet claim granted")
              .addTable([
                [
                  { data: "Field", header: true },
                  { data: "Value", header: true },
                ],
                ["Issue", `#${issue_number}`],
                ["Worker", worker],
                ["Branch", branch],
                ["Token", token],
              ])
              .write();
